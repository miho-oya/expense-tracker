openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: receipts
    description: Receipt parsing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /receipts/parse:
    post:
      operationId: parseReceipt
      tags: [receipts]
      summary: Parse a receipt image
      description: Uses AI vision to extract amount, date, merchant, and suggested category from a receipt screenshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptParseInput"
      responses:
        "200":
          description: Parsed receipt data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptParseResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ReceiptParseInput:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64 encoded image data (without data URI prefix)
        mimeType:
          type: string
          description: MIME type of the image (e.g. image/jpeg, image/png)
      required:
        - imageBase64
        - mimeType
    ReceiptParseResult:
      type: object
      properties:
        amount:
          type: number
          description: Total amount on the receipt
        currency:
          type: string
          description: ISO currency code (e.g. THB, JPY, USD)
        date:
          type: string
          description: Date of the transaction in YYYY-MM-DD format
        merchant:
          type: string
          description: Name of the merchant or payee (translated to Japanese when possible)
        suggestedCategory:
          type: string
          enum:
            - food
            - transport
            - shopping
            - entertainment
            - utilities
            - medical
            - other
          description: Suggested expense category
        rawNote:
          type: string
          description: Any additional notes extracted from the receipt
      required:
        - amount
        - currency
        - date
        - merchant
        - suggestedCategory
